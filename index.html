<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KI Objekterkennung - Live Kamera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .camera-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .video-container {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
        }

        video {
            width: 100%;
            display: block;
            background: #000;
        }

        canvas {
            width: 100%;
            display: block;
            border-radius: 15px;
            background: #f5f5f5;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .results-section {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #e0e0e0;
        }

        .results-title {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .detection-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .detection-item {
            background: white;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .detection-name {
            font-weight: bold;
            color: #667eea;
            font-size: 0.95em;
        }

        .detection-confidence {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
        }

        .confidence-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .status {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .status.loading {
            background: #fff3cd;
            color: #856404;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .camera-section {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.5em;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }

        .info-box {
            background: #e3f2fd;
            border-left: 4px solid #2196F3;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #1565c0;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 KI Objekterkennung</h1>
        
        <div id="status" class="status loading" style="display: none;"></div>

        <div class="controls">
            <button class="btn-primary" id="startBtn" onclick="startCamera()">📹 Kamera starten</button>
            <button class="btn-primary" id="stopBtn" onclick="stopCamera()" disabled>⏹️ Kamera stoppen</button>
            <button class="btn-secondary" id="captureBtn" onclick="captureFrame()" disabled>📸 Foto aufnehmen</button>
        </div>

        <div class="camera-section">
            <div>
                <h3 style="margin-bottom: 10px; color: #333;">Live-Video</h3>
                <div class="video-container">
                    <video id="video" autoplay playsinline></video>
                </div>
            </div>
            <div>
                <h3 style="margin-bottom: 10px; color: #333;">Analyse</h3>
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <div class="results-section">
            <div class="results-title">Erkannte Objekte:</div>
            <div id="resultsList" class="detection-list">
                <div class="empty-state">Starten Sie die Kamera und warten Sie auf die Analyse...</div>
            </div>
        </div>

        <div class="info-box">
            💡 <strong>Info:</strong> Diese App verwendet TensorFlow.js mit dem COCO-SSD Modell für Echtzeit-Objekterkennung. 
            Die Analyse läuft direkt in Ihrem Browser - keine Daten werden hochgeladen.
        </div>
    </div>

    <!-- TensorFlow.js und COCO-SSD Modell -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <script src="app.js"></script>
</body>
</html>
